name: CI

on:
  push:
    branches: [main, roadmap]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build KenseiECS.sln -c Release

      - name: Test (release)
        run: dotnet test KenseiECS.Tests -c Release --no-build

      - name: Test (KENSEI_DEBUG)
        run: dotnet test KenseiECS.Tests -c Release -p:KenseiDebug=true

      - name: Test source generator
        run: dotnet test KenseiECS.Generators.Tests -c Release --no-build

      - name: Example simulation (release)
        run: dotnet run --project Example -c Release --no-build -- --headless 1000

      - name: Example simulation (KENSEI_DEBUG)
        run: dotnet run --project Example -c Release -p:KenseiDebug=true -- --headless 1000

      - name: Build doc snippets (KENSEI_DEBUG)
        run: |
          dotnet build docs/snippets/Concepts -c Release -p:KenseiDebug=true
          dotnet build docs/snippets/Guides -c Release -p:KenseiDebug=true

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: README code blocks match compiled snippets
        run: npm run check:readme

      - name: Build site (fails on dead links)
        run: npm run build
