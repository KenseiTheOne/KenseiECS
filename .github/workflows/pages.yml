name: Docs site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - BENCHMARKS.md
      - KenseiECS/CHANGELOG.md
      - KenseiECS/**/*.cs
      - KenseiECS/Plugins/** # source generator used by Demo/Game
      - KenseiECS.NET/**
      - Demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x # Demo/Web targets net10.0 (the game library is net8.0)

      - uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Check README code blocks
        run: npm run check:readme

      - name: Build
        run: npm run build

      # The Horde demo: .NET WebAssembly (interpreter, no wasm-tools workload),
      # built with KENSEI_DEBUG so the overlay shows per-system timings.
      - name: Publish demo
        working-directory: .
        run: dotnet publish Demo/Web -c Release -p:KenseiDebug=true -o demo-out

      # Served at /KenseiECS/demo/. GitHub Pages ignores precompressed .br/.gz
      # siblings (it gzips on the fly and never sends Content-Encoding: br for
      # them), and the .NET loader fetches the plain files, so the compressed
      # copies would only double the artifact: drop them.
      - name: Add demo to the site
        working-directory: .
        run: |
          rm -rf docs/.vitepress/dist/demo
          cp -R demo-out/wwwroot docs/.vitepress/dist/demo
          find docs/.vitepress/dist/demo \( -name '*.br' -o -name '*.gz' \) -delete
          test -f docs/.vitepress/dist/demo/index.html
          du -sh docs/.vitepress/dist/demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
