name: Docs site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - BENCHMARKS.md
      - KenseiECS/CHANGELOG.md
      - KenseiECS/**/*.cs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Check README code blocks
        run: npm run check:readme

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
